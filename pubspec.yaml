name: anima_viewer
description: "Anima Viewer（赋灵 查看器）：查看与试听 .amproj 模型的动作与表情。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.5
  archive: ^4.3.0
  file_picker: ^13.1.0
  ffi: ^2.2.0
  path: ^1.9.1
  desktop_drop: ^0.8.4
  crypto: ^3.0.7
  collection: ^1.19.1
  intl: ^0.20.2

  # 引擎官方 Flutter 插件（外部纹理桥）。
  # agent1 交付后取消下一行注释即可接入；在此之前查看器通过
  # lib/core/engine/ 的抽象层 + 动态库探测工作，功能降级但不崩溃。
  # anima_engine:
  #   path: ../engine/flutter/anima_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
