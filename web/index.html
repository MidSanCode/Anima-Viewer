<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anima Viewer - 赋灵 查看器">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anima Viewer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anima Viewer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- 引擎 wasm 加载（可选，见 web/anima_engine/loader.js）。
       window.AnimaEngineLoader 是给 Dart 侧看的进度标记：
         undefined  = 本构建根本没带引擎 → Dart 不等待，直接降级；
         'pending'  = 正在加载 → Dart 等到 done / error 再决定。
       onerror 兜住 loader.js 本身取不到（例如未配置 ENGINE_WEB_URL）的情况，
       否则该模块脚本既不执行、也不派发事件，Dart 会一直等到超时。 -->
  <script>window.AnimaEngineLoader = 'pending';</script>
  <script>
    window.addEventListener('anima-engine-ready', function () {
      window.AnimaEngineLoader = 'done';
    });
  </script>
  <script type="module" src="anima_engine/loader.js"
          onerror="window.AnimaEngineLoader='error';window.dispatchEvent(new Event('anima-engine-ready'));"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
