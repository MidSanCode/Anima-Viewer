name: Build Anima Viewer

# 手动触发（与参考工程 openfield-app 一致）。查看器目前只有桌面 + Web 工程，
# 没有 android/ 与 ios/ 目录，所以平台开关就只有这四个。
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_web:
        description: 'Web'
        type: boolean
        default: false
      run_tests:
        description: '先跑 flutter analyze + test'
        type: boolean
        default: true

      # 勾选后把各平台**构建成功**的压缩包发布到 GitHub Releases。
      # 标题与 tag 都用「版本号+构建数字」（如 0.1.0+1）；已存在的同名资产
      # 会自动跳过，所以重复发布会补齐缺失的那些，不会报错。
      publish_release:
        description: '发布到 Releases（上传各平台压缩包）'
        type: boolean
        default: false

# 同一分支只保留最新一次构建，避免排队堆积。
concurrency:
  group: build-viewer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 钉住 Flutter 版本：构建产物可复现，也不会被上游 stable 更新悄悄改行为。
  # 仓库本地开发用的就是 3.44.4（Dart SDK ^3.12.2）。
  FLUTTER_VERSION: '3.44.4'

  # 引擎产物（可选）。引擎在**另一个仓库**里，本仓库的包默认**不含**引擎；
  # 此时应用自动降级到内置实现（功能完整、不崩溃，见
  # lib/core/engine/engine_bootstrap.dart）。
  #
  # **一般什么都不用配。** 构建时自动去引擎仓库的 Releases 里找本平台产物：
  # 从最新版开始往回试，最多看 5 个版本，取第一个带本平台产物的；那个版本
  # 没有就继续回退；最近 5 个版本都没有就跳过注入（产物用内置实现，构建不会
  # 失败）。这样引擎某个平台临时构建不出来时，自动落在上一个能用的版本上，
  # 不用人工干预。
  #
  # 想钉死地址时才配下面任一项 —— 配了就**不再**自动回退：
  #   ENGINE_WINDOWS_URL  桌面，anima.dll，或内含它的 zip（单平台包也行）
  #   ENGINE_LINUX_URL    Linux，libanima.so，或内含它的 .tar.gz / .zip
  #   ENGINE_MACOS_URL    macOS，libanima.dylib，或内含它的 .tar.gz / .zip
  #   ENGINE_WEB_URL      Web，wasm-bindgen 产物 .zip（anima_wasm.js + _bg.wasm）
  #
  # 引擎仓库的资产名固定、不含版本号，所以也可以直接指向「永远最新」：
  #   https://github.com/midsancode/anima-engine/releases/latest/download/anima-engine-windows-x64.zip
  ENGINE_WINDOWS_URL: ${{ vars.ENGINE_WINDOWS_URL }}
  ENGINE_LINUX_URL: ${{ vars.ENGINE_LINUX_URL }}
  ENGINE_MACOS_URL: ${{ vars.ENGINE_MACOS_URL }}
  ENGINE_WEB_URL: ${{ vars.ENGINE_WEB_URL }}

jobs:
  # 先跑测试再打包：把「代码坏了」挡在制品之前。
  # 注意工作目录是仓库根（不是子目录），因为 viewer/ 自身就是一个 git 仓库。
  verify:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  windows:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1].Trim()
          $parts = $ver.Split('+')
          "BUILD_NAME=$($parts[0])"   >> $env:GITHUB_ENV
          "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Write build config
        shell: pwsh
        run: |
          # 应用内「关于」读的是这些 define（lib/core/platform/app_info.dart）。
          # 用 --dart-define-from-file 而不是改仓库文件：同一次提交能产出
          # 不同构建号的包，仓库保持干净。
          @{
            BUILD_VERSION = "$env:BUILD_NAME"
            BUILD_NUMBER  = "$env:BUILD_NUMBER"
          } | ConvertTo-Json -Compress | Set-Content config.json -Encoding utf8
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 配了 ENGINE_WINDOWS_URL 就直接用这个地址（单平台包 / 裸 anima.dll / 具体版本
        # 直链都行）。没配就自动找：从引擎 Release 最新版开始往回试，最多看 5 个版本，
        # 取第一个带 Windows 产物的；都没有就跳过注入（产物用内置实现，不会失败）。
        shell: pwsh
        run: |
          $maxBack = 5
          $api = if ($env:ANIMA_ENGINE_API_BASE) { $env:ANIMA_ENGINE_API_BASE } else { 'https://api.github.com' }
          $repo = if ($env:ANIMA_ENGINE_REPO) { $env:ANIMA_ENGINE_REPO } else { 'midsancode/anima-engine' }
          $assetName = 'anima-engine-windows-x64.zip'

          $tmp = Join-Path $env:RUNNER_TEMP 'engine-windows'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $file = Join-Path $tmp 'download.bin'

          function Save-Engine([string]$u, [string]$out) {
            if ($u -like 'file://*') { Copy-Item ($u -replace '^file:///', '') $out -Force }
            else { Invoke-WebRequest -Uri $u -OutFile $out }
          }

          $url = $null
          if ($env:ENGINE_WINDOWS_URL) {
            $url = $env:ENGINE_WINDOWS_URL
            Save-Engine $url $file
          } else {
            $tried = @()
            for ($i = 1; $i -le $maxBack; $i++) {
              $rel = $null
              try { $rel = Invoke-RestMethod -Uri "$api/repos/$repo/releases?per_page=1&page=$i" -Headers @{ 'User-Agent' = 'anima-ci' } }
              catch { Write-Host "::warning::拿不到 $repo 的 Release 列表：$_"; break }
              if (-not $rel -or -not $rel.tag_name) { Write-Host '  没有更多版本了'; break }
              $tag = $rel.tag_name
              $tried += $tag
              $asset = $rel.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
              if (-not $asset) { Write-Host "  $tag：没有本平台产物，继续回退"; continue }
              try {
                Save-Engine $asset.browser_download_url $file
                $url = $asset.browser_download_url
                Write-Host "  $tag：取到 $($asset.name)"
                break
              } catch { Write-Host "  $tag：下载失败，继续回退" }
            }
            if (-not $url) {
              Write-Host "::warning::最近 $maxBack 个版本都没有本平台产物（$assetName），跳过引擎注入；产物将用内置实现。看过的版本：$($tried -join ' ')"
              exit 0
            }
          }

          $bytes = [IO.File]::ReadAllBytes($file)
          $dll = $null
          if ($bytes.Length -gt 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            $x = Join-Path $tmp 'x'
            Remove-Item -Recurse -Force $x -ErrorAction SilentlyContinue
            # Expand-Archive 只认 .zip 扩展名，得先改名（下载时为了通用叫 .bin）。
            $zip = Join-Path $tmp 'engine.zip'
            Remove-Item -Force $zip -ErrorAction SilentlyContinue
            Move-Item $file $zip -Force
            Expand-Archive -Path $zip -DestinationPath $x -Force
            $found = Get-ChildItem $x -Recurse -Filter 'anima.dll' -File | Sort-Object FullName
            $preferred = $found | Where-Object { $_.DirectoryName -match 'windows$' } | Select-Object -First 1
            $dll = if ($preferred) { $preferred.FullName } elseif ($found) { $found[0].FullName } else { $null }
            if (-not $dll) { throw "$url 里找不到 anima.dll" }
          } elseif ($bytes.Length -gt 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            $dll = $file
          } else {
            $magic = if ($bytes.Length -ge 2) { '{0:X2}{1:X2}' -f $bytes[0], $bytes[1] } else { '??' }
            throw "既不是 zip 也不是 PE 动态库（前 2 字节 $magic）：$url"
          }
          $dest = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $dll (Join-Path $dest 'anima.dll') -Force
          Get-Item (Join-Path $dest 'anima.dll') | Select-Object FullName, Length
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath anima-viewer-windows-$env:BUILD_NAME-portable.zip
      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          # 安装器是「锦上添花」：装不上 Inno Setup 也不该让整条流水线失败。
          choco install innosetup --no-progress -y
          $name = "赋灵 Anima Viewer"
          $iss = @"
          [Setup]
          AppName=$name
          AppVersion=$env:BUILD_NAME
          DefaultDirName={autopf}\Anima Viewer
          DefaultGroupName=$name
          OutputDir=installer_output
          OutputBaseFilename=anima-viewer-setup-$env:BUILD_NAME
          UninstallDisplayIcon={app}\anima_viewer.exe
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          $iss | Out-File setup.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Windows-portable
          path: anima-viewer-windows-${{ env.BUILD_NAME }}-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('installer_output/*.exe') != '' }}
        with:
          name: anima-viewer-Windows-installer
          path: installer_output/*.exe

  linux:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Install system dependencies
        run: |
          # Flutter Linux 桌面工具链：clang/cmake/ninja/pkg-config + GTK3。
          # libsecret / libasound2 供 shared_preferences 等插件链接。
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_LINUX_URL；没配就从引擎 Release 最新版开始往回找本平台产物。
        run: |
          set -euo pipefail
          # 引擎产物（可选）。配了 ENGINE_LINUX_URL 就直接用这个地址 —— 单平台包、裸库文件、
          # 指向某个具体版本的直链都行。
          #
          # 没配就自动找：从引擎 Release 的**最新版开始往回**试，最多看 5 个
          # 版本，取第一个带本平台产物的；那个版本没有本平台产物就继续回退；最近
          # 5 个版本都没有就跳过注入 —— 产物用内置实现（功能完整、不崩溃，见
          # lib/core/engine/engine_bootstrap.dart），不会让构建失败。
          #
          # API / REPO 一般不用改，默认就是引擎仓库；fork 或自建镜像时才需要。
          API="${ANIMA_ENGINE_API_BASE:-https://api.github.com}"
          REPO="${ANIMA_ENGINE_REPO:-midsancode/anima-engine}"
          ASSET='anima-engine-linux-x64.tar.gz'
          ASSET_RE='anima-engine-linux-x64\.tar\.gz'
          MAX_BACK=5

          TMP="$RUNNER_TEMP/engine-linux"
          rm -rf "$TMP"; mkdir -p "$TMP"

          pull() { case "$1" in file://*) cp "${1#file://}" "$2" ;; *) curl -fsSL "$1" -o "$2" ;; esac; }
          get_json() { case "$1" in file://*) cat "${1#file://}" ;; *) curl -fsSL "$1" ;; esac; }

          URL=""
          if [ -n "${ENGINE_LINUX_URL:-}" ]; then
            URL="${ENGINE_LINUX_URL}"
            pull "$URL" "$TMP/download.bin"
          else
            TRIED=""
            i=1
            while [ "$i" -le "$MAX_BACK" ]; do
              REL=$(get_json "$API/repos/$REPO/releases?per_page=1&page=$i" || true)
              i=$((i + 1))
              TAG=$(printf '%s' "$REL" | grep -o '"tag_name": *"[^"]*"' | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              [ -n "$TAG" ] || break
              TRIED="$TRIED $TAG"
              PAT='"browser_download_url": *"[^"]*'"$ASSET_RE"'"'
              CAND=$(printf '%s' "$REL" | grep -o "$PAT" | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              if [ -z "$CAND" ]; then
                echo "  $TAG：没有本平台产物，继续回退"
                continue
              fi
              if pull "$CAND" "$TMP/download.bin"; then
                URL="$CAND"
                echo "  $TAG：取到 $ASSET"
                break
              fi
              echo "  $TAG：下载失败，继续回退"
            done
            if [ -z "$URL" ]; then
              echo "::warning::最近 $MAX_BACK 个版本都没有本平台产物（$ASSET），跳过引擎注入；产物将用内置实现。看过的版本：$TRIED"
              exit 0
            fi
          fi
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP/x"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP/x" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 应当是裸库本身。校验 ELF 魔数，免得把 404 页面当成 .so
            # 装进产物（那会让应用在运行期静默降级，问题极难排查）。
            MAGIC=$(od -An -tx1 -N4 "$TMP/download.bin" | tr -d '[:space:]')
            [ "$MAGIC" = "7f454c46" ] || { echo "::error::$URL 既不是归档也不是 ELF 动态库（前 4 字节 $MAGIC）"; exit 1; }
            cp "$TMP/download.bin" "$TMP/x/libanima.so"
          fi
          # 排除 ABI 目录：Android 的 jni/<abi>/libanima.so 与本平台的同名，别拿错。
          FOUND=$(find "$TMP/x" -type f -name 'libanima.so' \
            -not -path '*/arm64-v8a/*' -not -path '*/armeabi-v7a/*' \
            -not -path '*/x86_64/*' -not -path '*/x86/*' -print -quit)
          [ -n "$FOUND" ] || { echo "::error::$URL 里找不到 Linux 的 libanima.so"; exit 1; }
          # 放到 bundle/lib/：引擎会在 exe 同级与 exe/lib 下查找。
          mkdir -p build/linux/x64/release/bundle/lib
          cp "$FOUND" build/linux/x64/release/bundle/lib/libanima.so
          echo "injected $FOUND"
      - name: Package tarball
        run: tar -czf anima-viewer-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Linux
          path: anima-viewer-linux-${{ env.BUILD_NAME }}.tar.gz
          if-no-files-found: error

  macos:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_MACOS_URL；没配就从引擎 Release 最新版开始往回找本平台产物。
        run: |
          set -euo pipefail
          # 引擎产物（可选）。配了 ENGINE_MACOS_URL 就直接用这个地址 —— 单平台包、裸库文件、
          # 指向某个具体版本的直链都行。
          #
          # 没配就自动找：从引擎 Release 的**最新版开始往回**试，最多看 5 个
          # 版本，取第一个带本平台产物的；那个版本没有本平台产物就继续回退；最近
          # 5 个版本都没有就跳过注入 —— 产物用内置实现（功能完整、不崩溃，见
          # lib/core/engine/engine_bootstrap.dart），不会让构建失败。
          #
          # API / REPO 一般不用改，默认就是引擎仓库；fork 或自建镜像时才需要。
          API="${ANIMA_ENGINE_API_BASE:-https://api.github.com}"
          REPO="${ANIMA_ENGINE_REPO:-midsancode/anima-engine}"
          ASSET='anima-engine-macos-universal.tar.gz'
          ASSET_RE='anima-engine-macos-universal\.tar\.gz'
          MAX_BACK=5

          TMP="$RUNNER_TEMP/engine-macos"
          rm -rf "$TMP"; mkdir -p "$TMP"

          pull() { case "$1" in file://*) cp "${1#file://}" "$2" ;; *) curl -fsSL "$1" -o "$2" ;; esac; }
          get_json() { case "$1" in file://*) cat "${1#file://}" ;; *) curl -fsSL "$1" ;; esac; }

          URL=""
          if [ -n "${ENGINE_MACOS_URL:-}" ]; then
            URL="${ENGINE_MACOS_URL}"
            pull "$URL" "$TMP/download.bin"
          else
            TRIED=""
            i=1
            while [ "$i" -le "$MAX_BACK" ]; do
              REL=$(get_json "$API/repos/$REPO/releases?per_page=1&page=$i" || true)
              i=$((i + 1))
              TAG=$(printf '%s' "$REL" | grep -o '"tag_name": *"[^"]*"' | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              [ -n "$TAG" ] || break
              TRIED="$TRIED $TAG"
              PAT='"browser_download_url": *"[^"]*'"$ASSET_RE"'"'
              CAND=$(printf '%s' "$REL" | grep -o "$PAT" | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              if [ -z "$CAND" ]; then
                echo "  $TAG：没有本平台产物，继续回退"
                continue
              fi
              if pull "$CAND" "$TMP/download.bin"; then
                URL="$CAND"
                echo "  $TAG：取到 $ASSET"
                break
              fi
              echo "  $TAG：下载失败，继续回退"
            done
            if [ -z "$URL" ]; then
              echo "::warning::最近 $MAX_BACK 个版本都没有本平台产物（$ASSET），跳过引擎注入；产物将用内置实现。看过的版本：$TRIED"
              exit 0
            fi
          fi
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP/x"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP/x" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 应当是裸库本身。校验 Mach-O 魔数（含 universal）。
            MAGIC=$(od -An -tx1 -N4 "$TMP/download.bin" | tr -d '[:space:]')
            case "$MAGIC" in
              cffaedfe|cefaedfe|cafebabe|bebafeca) ;;
              *) echo "::error::$URL 既不是归档也不是 Mach-O 动态库（前 4 字节 $MAGIC）"; exit 1 ;;
            esac
            cp "$TMP/download.bin" "$TMP/x/libanima.dylib"
          fi
          FOUND=$(find "$TMP/x" -type f -name 'libanima.dylib' -print -quit)
          [ -n "$FOUND" ] || { echo "::error::$URL 里找不到 libanima.dylib"; exit 1; }
          APP_DIR=$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)
          [ -n "$APP_DIR" ] || { echo "::error::找不到构建出来的 .app 目录"; exit 1; }
          cp "$FOUND" "$APP_DIR/Contents/MacOS/libanima.dylib"
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp "$FOUND" "$APP_DIR/Contents/Frameworks/libanima.dylib"
          echo "injected $FOUND"
      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          # 用 glob 匹配 *.app，而不是写死 Runner.app / anima_viewer.app ——
          # 改产品名也不会把打包这一步弄坏。
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "packaging $APP_NAME"
          zip -qry ../../../../../anima-viewer-macos-${{ env.BUILD_NAME }}.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-macOS
          path: anima-viewer-macos-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  web:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": ""
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      # 引擎 wasm（可选）：下载 wasm-bindgen 产物，放进 web/anima_engine/，
      # flutter build 会把 web/ 下的文件原样复制进产物。
      - name: Inject engine (optional)
        # 地址优先用 ENGINE_WEB_URL；没配就从引擎 Release 最新版开始往回找本平台产物。
        run: |
          set -euo pipefail
          # 引擎产物（可选）。配了 ENGINE_WEB_URL 就直接用这个地址 —— 单平台包、裸库文件、
          # 指向某个具体版本的直链都行。
          #
          # 没配就自动找：从引擎 Release 的**最新版开始往回**试，最多看 5 个
          # 版本，取第一个带本平台产物的；那个版本没有本平台产物就继续回退；最近
          # 5 个版本都没有就跳过注入 —— 产物用内置实现（功能完整、不崩溃，见
          # lib/core/engine/engine_bootstrap.dart），不会让构建失败。
          #
          # API / REPO 一般不用改，默认就是引擎仓库；fork 或自建镜像时才需要。
          API="${ANIMA_ENGINE_API_BASE:-https://api.github.com}"
          REPO="${ANIMA_ENGINE_REPO:-midsancode/anima-engine}"
          ASSET='anima-engine-web.zip'
          ASSET_RE='anima-engine-web\.zip'
          MAX_BACK=5

          TMP="$RUNNER_TEMP/engine-web"
          rm -rf "$TMP"; mkdir -p "$TMP"

          pull() { case "$1" in file://*) cp "${1#file://}" "$2" ;; *) curl -fsSL "$1" -o "$2" ;; esac; }
          get_json() { case "$1" in file://*) cat "${1#file://}" ;; *) curl -fsSL "$1" ;; esac; }

          URL=""
          if [ -n "${ENGINE_WEB_URL:-}" ]; then
            URL="${ENGINE_WEB_URL}"
            pull "$URL" "$TMP/download.bin"
          else
            TRIED=""
            i=1
            while [ "$i" -le "$MAX_BACK" ]; do
              REL=$(get_json "$API/repos/$REPO/releases?per_page=1&page=$i" || true)
              i=$((i + 1))
              TAG=$(printf '%s' "$REL" | grep -o '"tag_name": *"[^"]*"' | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              [ -n "$TAG" ] || break
              TRIED="$TRIED $TAG"
              PAT='"browser_download_url": *"[^"]*'"$ASSET_RE"'"'
              CAND=$(printf '%s' "$REL" | grep -o "$PAT" | head -n 1 | sed 's/.*: *"//; s/"$//' || true)
              if [ -z "$CAND" ]; then
                echo "  $TAG：没有本平台产物，继续回退"
                continue
              fi
              if pull "$CAND" "$TMP/download.bin"; then
                URL="$CAND"
                echo "  $TAG：取到 $ASSET"
                break
              fi
              echo "  $TAG：下载失败，继续回退"
            done
            if [ -z "$URL" ]; then
              echo "::warning::最近 $MAX_BACK 个版本都没有本平台产物（$ASSET），跳过引擎注入；产物将用内置实现。看过的版本：$TRIED"
              exit 0
            fi
          fi
          head -c 2 "$TMP/download.bin" | grep -q 'PK' || { echo "::error::$URL 不是 zip"; exit 1; }
          rm -rf "$TMP/x"; mkdir -p "$TMP/x"
          unzip -qq -o "$TMP/download.bin" -d "$TMP/x"
          JS=$(find "$TMP/x" -type f -name 'anima_wasm.js' -print -quit)
          BG=$(find "$TMP/x" -type f -name 'anima_wasm_bg.wasm' -print -quit)
          [ -n "$JS" ] || { echo "::error::$URL 里没有 anima_wasm.js"; exit 1; }
          [ -n "$BG" ] || { echo "::error::$URL 里没有 anima_wasm_bg.wasm"; exit 1; }
          # flutter build web 会把 web/ 下的文件原样复制进产物。
          mkdir -p web/anima_engine
          cp "$JS" "$BG" web/anima_engine/
          # loader.js 是**入库的源码**（web/anima_engine/loader.js），这里不生成：
          # 它用可捕获的动态 import 加载 wasm，缺失时静默降级，不用 CI 现场拼 JS。
          test -f web/anima_engine/loader.js || { echo "::error::缺少 web/anima_engine/loader.js"; exit 1; }
          ls -l web/anima_engine
      - name: Build web
        # --no-wasm-dry-run：跳过 wasm 兼容性扫描。Dart 侧不编译成 wasm
        # （引擎是独立的 wasm 模块，经 js_interop 调用，见
        # lib/core/engine/web_wasm_am_engine_web.dart），扫描只会顺着它一路报错。
        run: flutter build web --release --no-wasm-dry-run --dart-define-from-file=config.json
      - name: Package zip
        run: |
          cd build/web
          zip -r ../../anima-viewer-web-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Web
          path: anima-viewer-web-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  # 发布：把各平台**构建成功**的产物挂到 GitHub Release。
  # 勾选 publish_release 才跑；标题与 tag 都是「版本号+构建数字」（如 0.1.0+1）。
  # 已存在的同名资产跳过上传，所以重复发布会自动「补齐缺失的那个」，幂等。
  release:
    needs: [verify, windows, linux, macos, web]
    # 触发条件：勾了发布开关，且至少勾了一个平台（否则没有任何产物可发）。
    # 用 !cancelled() 而不是 !failure()：某个平台构建失败时，仍然把**成功**的
    # 那些发出去；失败作业本身在运行页就是红的，不会看不见。
    if: ${{ always() && !cancelled() && inputs.publish_release && (inputs.build_windows || inputs.build_linux || inputs.build_macos || inputs.build_web) }}
    runs-on: ubuntu-latest
    # 建 Release 需要写权限。只给这一条作业，其余作业仍是 contents: read。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 各平台上传的 artifact 汇总到 dist/。merge-multiple 拍平目录层级，于是
      # 所有包平铺在 dist/ 下，后面按 basename 判断重名。
      # 一个产物都没有时这个 action 会报错，所以 continue-on-error，交给下一步
      # 给出更清楚的提示。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          case "$VER" in
            *+*) VERSION="${VER%%+*}"; BUILD="${VER##*+}" ;;
            *)   VERSION="$VER";       BUILD="" ;;
          esac
          if [ -n "$BUILD" ]; then TAG="${VERSION}+${BUILD}"; else TAG="$VERSION"; fi
          echo "版本号 $VERSION / 构建号 $BUILD → tag $TAG"

          mkdir -p dist
          # 刻意不加 -maxdepth：万一以后某个 artifact 带了子目录，递归找出来
          # 至少会尝试上传；加了限制则是静默漏掉，更难发现。
          FILES=$(find dist -type f | sort)
          if [ -z "$FILES" ]; then
            echo "::error::dist/ 里没有任何产物，请确认至少有一个平台真的构建成功"
            exit 1
          fi
          echo "本次可发布的产物："
          echo "$FILES"

          # 先确保 Release 存在。已存在就复用 —— gh release create 撞上同名 tag
          # 会直接报错，不能无脑建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用它并补齐缺失资产"
          else
            NOTES=$(printf 'Anima Viewer %s\n\n- commit: %s\n' "$TAG" "$GITHUB_SHA")
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
            echo "已创建 Release $TAG"
          fi

          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [ -n "$EXISTING" ]; then echo "该 Release 上已有的资产："; echo "$EXISTING"; fi

          # 逐个判断重名，同名就跳过。
          upload=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name=$(basename "$f")
            # 用 here-string 而不是管道：pipefail 下 grep -q 提前退出可能让 printf
            # 收到 SIGPIPE，把「找到了」误判成「没找到」。
            if grep -Fxq -- "$name" <<< "$EXISTING"; then
              echo "跳过（同名资产已存在）：$name"
              continue
            fi
            upload+=("$f")
          done <<< "$FILES"

          if [ ${#upload[@]} -eq 0 ]; then
            echo "::notice::所有资产都已存在，无需上传"
          else
            echo "上传 ${#upload[@]} 个新资产"
            gh release upload "$TAG" "${upload[@]}"
            echo "::notice::Release $TAG 已更新"
          fi
