name: Build Anima Viewer

# 手动触发（与参考工程 openfield-app 一致）。查看器目前只有桌面 + Web 工程，
# 没有 android/ 与 ios/ 目录，所以平台开关就只有这四个。
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Windows (x64)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (x64)'
        type: boolean
        default: false
      build_macos:
        description: 'macOS (x64/ARM)'
        type: boolean
        default: false
      build_web:
        description: 'Web'
        type: boolean
        default: false
      run_tests:
        description: '先跑 flutter analyze + test'
        type: boolean
        default: true

      # 勾选后把各平台**构建成功**的压缩包发布到 GitHub Releases。
      # 标题与 tag 都用「版本号+构建数字」（如 0.1.0+1）；已存在的同名资产
      # 会自动跳过，所以重复发布会补齐缺失的那些，不会报错。
      publish_release:
        description: '发布到 Releases（上传各平台压缩包）'
        type: boolean
        default: false

# 同一分支只保留最新一次构建，避免排队堆积。
concurrency:
  group: build-viewer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 钉住 Flutter 版本：构建产物可复现，也不会被上游 stable 更新悄悄改行为。
  # 仓库本地开发用的就是 3.44.4（Dart SDK ^3.12.2）。
  FLUTTER_VERSION: '3.44.4'

  # 引擎动态库（可选）。引擎在**另一个仓库**里，本仓库的包默认**不含**
  # `anima.dll` / `libanima.so`；此时应用自动降级到内置实现（功能完整、不崩溃，
  # 见 lib/core/engine/engine_bootstrap.dart）。想让产物带上真引擎，在仓库
  # Settings → Variables 里配置下列变量为「引擎库的直链」，构建时自动注入：
  #   ENGINE_WINDOWS_URL / ENGINE_LINUX_URL / ENGINE_MACOS_URL
  ENGINE_WINDOWS_URL: ${{ vars.ENGINE_WINDOWS_URL }}
  ENGINE_LINUX_URL: ${{ vars.ENGINE_LINUX_URL }}
  ENGINE_MACOS_URL: ${{ vars.ENGINE_MACOS_URL }}

jobs:
  # 先跑测试再打包：把「代码坏了」挡在制品之前。
  # 注意工作目录是仓库根（不是子目录），因为 viewer/ 自身就是一个 git 仓库。
  verify:
    if: inputs.run_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded

  windows:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: ').Line.Split(': ')[-1].Trim()
          $parts = $ver.Split('+')
          "BUILD_NAME=$($parts[0])"   >> $env:GITHUB_ENV
          "BUILD_NUMBER=$($parts[1])" >> $env:GITHUB_ENV
      - name: Write build config
        shell: pwsh
        run: |
          # 应用内「关于」读的是这些 define（lib/core/platform/app_info.dart）。
          # 用 --dart-define-from-file 而不是改仓库文件：同一次提交能产出
          # 不同构建号的包，仓库保持干净。
          @{
            BUILD_VERSION = "$env:BUILD_NAME"
            BUILD_NUMBER  = "$env:BUILD_NUMBER"
          } | ConvertTo-Json -Compress | Set-Content config.json -Encoding utf8
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine library (optional)
        if: env.ENGINE_WINDOWS_URL != ''
        shell: pwsh
        run: |
          # ENGINE_WINDOWS_URL 可以是裸 anima.dll，也可以是打包好的 .zip。
          # 引擎查找顺序包含「exe 同级目录」（ffi_am_engine_io.dart），放这里即可。
          $dest = "build\windows\x64\runner\Release"
          $tmp  = Join-Path $env:RUNNER_TEMP "anima-engine"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $file = Join-Path $tmp "download.bin"
          Invoke-WebRequest -Uri "$env:ENGINE_WINDOWS_URL" -OutFile $file
          $bytes = [IO.File]::ReadAllBytes($file)
          $dll = $null
          if ($bytes.Length -gt 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            # ZIP（PK\x03\x04）：解包后在产物里找 anima.dll。
            # Expand-Archive 只认 .zip 扩展名，所以先改名再解。
            $zip = Join-Path $tmp "engine.zip"
            Move-Item $file $zip -Force
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            $dll = Get-ChildItem $tmp -Recurse -Filter anima.dll -File | Select-Object -First 1
          } else {
            # 裸动态库：下载下来的就是它本身。
            $dll = Get-Item $file
          }
          if (-not $dll) { throw "anima.dll not found in $env:ENGINE_WINDOWS_URL" }
          Copy-Item $dll.FullName (Join-Path $dest "anima.dll") -Force
          Write-Host "injected $($dll.FullName)"
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath anima-viewer-windows-$env:BUILD_NAME-portable.zip
      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          # 安装器是「锦上添花」：装不上 Inno Setup 也不该让整条流水线失败。
          choco install innosetup --no-progress -y
          $name = "赋灵 Anima Viewer"
          $iss = @"
          [Setup]
          AppName=$name
          AppVersion=$env:BUILD_NAME
          DefaultDirName={autopf}\Anima Viewer
          DefaultGroupName=$name
          OutputDir=installer_output
          OutputBaseFilename=anima-viewer-setup-$env:BUILD_NAME
          UninstallDisplayIcon={app}\anima_viewer.exe
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          $iss | Out-File setup.iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Windows-portable
          path: anima-viewer-windows-${{ env.BUILD_NAME }}-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('installer_output/*.exe') != '' }}
        with:
          name: anima-viewer-Windows-installer
          path: installer_output/*.exe

  linux:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Install system dependencies
        run: |
          # Flutter Linux 桌面工具链：clang/cmake/ninja/pkg-config + GTK3。
          # libsecret / libasound2 供 shared_preferences 等插件链接。
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build linux --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine library (optional)
        if: env.ENGINE_LINUX_URL != ''
        run: |
          # ENGINE_LINUX_URL 可以是裸 libanima.so，也可以是打包好的 .tar.gz / .zip。
          set -euo pipefail
          # 放到 bundle/lib/：引擎会在 exe 同级与 exe/lib 下查找。
          TMP=$(mktemp -d)
          curl -fsSL "$ENGINE_LINUX_URL" -o "$TMP/download.bin"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 下载下来的就是裸库本身。
            cp "$TMP/download.bin" "$TMP/libanima.so"
          fi
          FOUND=$(find "$TMP" -name 'libanima.so' -type f -print -quit)
          [ -n "$FOUND" ] || { echo "libanima.so not found in $ENGINE_LINUX_URL"; exit 1; }
          mkdir -p build/linux/x64/release/bundle/lib
          cp "$FOUND" build/linux/x64/release/bundle/lib/libanima.so
          echo "injected $FOUND"
      - name: Package tarball
        run: tar -czf anima-viewer-linux-${{ env.BUILD_NAME }}.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Linux
          path: anima-viewer-linux-${{ env.BUILD_NAME }}.tar.gz
          if-no-files-found: error

  macos:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}"  >> $GITHUB_ENV
          echo "BUILD_NUMBER=${VER##*+}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": "$BUILD_NUMBER"
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build release
        run: flutter build macos --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define-from-file=config.json
      - name: Inject engine library (optional)
        if: env.ENGINE_MACOS_URL != ''
        run: |
          # ENGINE_MACOS_URL 可以是裸 libanima.dylib，也可以是打包好的 .tar.gz / .zip。
          set -euo pipefail
          # 先解析出真实 .app 名（不写死产物名）。Contents/MacOS/ 是 dyld 内置
          # 加载器实际查的目录；Contents/Frameworks/ 则覆盖走 @rpath 的情形。
          APP_DIR=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d -print -quit)
          TMP=$(mktemp -d)
          curl -fsSL "$ENGINE_MACOS_URL" -o "$TMP/download.bin"
          if tar -tzf "$TMP/download.bin" >/dev/null 2>&1; then
            tar -xzf "$TMP/download.bin" -C "$TMP"
          elif unzip -qq -o "$TMP/download.bin" -d "$TMP" >/dev/null 2>&1; then
            :
          else
            # 不是归档 → 下载下来的就是裸库本身。
            cp "$TMP/download.bin" "$TMP/libanima.dylib"
          fi
          FOUND=$(find "$TMP" -name 'libanima.dylib' -type f -print -quit)
          [ -n "$FOUND" ] || { echo "libanima.dylib not found in $ENGINE_MACOS_URL"; exit 1; }
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Frameworks"
          cp "$FOUND" "$APP_DIR/Contents/MacOS/libanima.dylib"
          cp "$FOUND" "$APP_DIR/Contents/Frameworks/libanima.dylib"
          echo "injected $FOUND"
      - name: Package app bundle
        run: |
          cd build/macos/Build/Products/Release
          # 用 glob 匹配 *.app，而不是写死 Runner.app / anima_viewer.app ——
          # 改产品名也不会把打包这一步弄坏。
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "packaging $APP_NAME"
          zip -qry ../../../../../anima-viewer-macos-${{ env.BUILD_NAME }}.zip "$APP_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-macOS
          path: anima-viewer-macos-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  web:
    needs: verify
    if: ${{ always() && !cancelled() && !failure() && inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read version from pubspec
        run: |
          VER=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "BUILD_NAME=${VER%%+*}" >> $GITHUB_ENV
      - name: Write build config
        run: |
          cat > config.json <<EOF
          {
            "BUILD_VERSION": "$BUILD_NAME",
            "BUILD_NUMBER": ""
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build web
        # --no-wasm-dry-run：只出 JS 包，但兼容性扫描会顺着 dart:ffi /
        # dart:html 一路报错。跳过扫描；反正也不产出 wasm 产物。
        run: flutter build web --release --no-wasm-dry-run --dart-define-from-file=config.json
      - name: Package zip
        run: |
          cd build/web
          zip -r ../../anima-viewer-web-${{ env.BUILD_NAME }}.zip .
          cd -
      - uses: actions/upload-artifact@v4
        with:
          name: anima-viewer-Web
          path: anima-viewer-web-${{ env.BUILD_NAME }}.zip
          if-no-files-found: error

  # 发布：把各平台**构建成功**的产物挂到 GitHub Release。
  # 勾选 publish_release 才跑；标题与 tag 都是「版本号+构建数字」（如 0.1.0+1）。
  # 已存在的同名资产跳过上传，所以重复发布会自动「补齐缺失的那个」，幂等。
  release:
    needs: [verify, windows, linux, macos, web]
    # 触发条件：勾了发布开关，且至少勾了一个平台（否则没有任何产物可发）。
    # 用 !cancelled() 而不是 !failure()：某个平台构建失败时，仍然把**成功**的
    # 那些发出去；失败作业本身在运行页就是红的，不会看不见。
    if: ${{ always() && !cancelled() && inputs.publish_release && (inputs.build_windows || inputs.build_linux || inputs.build_macos || inputs.build_web) }}
    runs-on: ubuntu-latest
    # 建 Release 需要写权限。只给这一条作业，其余作业仍是 contents: read。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 各平台上传的 artifact 汇总到 dist/。merge-multiple 拍平目录层级，于是
      # 所有包平铺在 dist/ 下，后面按 basename 判断重名。
      # 一个产物都没有时这个 action 会报错，所以 continue-on-error，交给下一步
      # 给出更清楚的提示。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          case "$VER" in
            *+*) VERSION="${VER%%+*}"; BUILD="${VER##*+}" ;;
            *)   VERSION="$VER";       BUILD="" ;;
          esac
          if [ -n "$BUILD" ]; then TAG="${VERSION}+${BUILD}"; else TAG="$VERSION"; fi
          echo "版本号 $VERSION / 构建号 $BUILD → tag $TAG"

          mkdir -p dist
          # 刻意不加 -maxdepth：万一以后某个 artifact 带了子目录，递归找出来
          # 至少会尝试上传；加了限制则是静默漏掉，更难发现。
          FILES=$(find dist -type f | sort)
          if [ -z "$FILES" ]; then
            echo "::error::dist/ 里没有任何产物，请确认至少有一个平台真的构建成功"
            exit 1
          fi
          echo "本次可发布的产物："
          echo "$FILES"

          # 先确保 Release 存在。已存在就复用 —— gh release create 撞上同名 tag
          # 会直接报错，不能无脑建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，复用它并补齐缺失资产"
          else
            NOTES=$(printf 'Anima Viewer %s\n\n- commit: %s\n' "$TAG" "$GITHUB_SHA")
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "$NOTES"
            echo "已创建 Release $TAG"
          fi

          EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [ -n "$EXISTING" ]; then echo "该 Release 上已有的资产："; echo "$EXISTING"; fi

          # 逐个判断重名，同名就跳过。
          upload=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name=$(basename "$f")
            # 用 here-string 而不是管道：pipefail 下 grep -q 提前退出可能让 printf
            # 收到 SIGPIPE，把「找到了」误判成「没找到」。
            if grep -Fxq -- "$name" <<< "$EXISTING"; then
              echo "跳过（同名资产已存在）：$name"
              continue
            fi
            upload+=("$f")
          done <<< "$FILES"

          if [ ${#upload[@]} -eq 0 ]; then
            echo "::notice::所有资产都已存在，无需上传"
          else
            echo "上传 ${#upload[@]} 个新资产"
            gh release upload "$TAG" "${upload[@]}"
            echo "::notice::Release $TAG 已更新"
          fi
